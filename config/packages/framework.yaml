# config/packages/framework.yaml

framework:
  secret: '%env(APP_SECRET)%'
  test: true                  #

  # Configuration de la session (requise pour Symfony Security)
  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
    storage_factory_id: session.storage.factory.native

  serializer:
    enabled: true
