parameters:
  app.database_name: '%env(POSTGRES_DATABASE_TEST)%'
  app.database_host: '%env(POSTGRES_HOST_TEST)%'
  app.database_login: '%env(POSTGRES_USER_TEST)%'
  app.database_password: '%env(POSTGRES_PASSWORD_TEST)%'
  app.helios_ftp_server: 'ftp'
  app.helios_ftp_port: '21'
  app.helios_ftp_passive_mode: 'true'
  app.helios_ftp_connection_mode: 'SIMULATEUR'
  app.helios_ftp_login: 'helios'
  app.helios_ftp_password: 'helios'
  app.helios_ftp_response_server_path: '/sortie/'
  app.helios_ftp_response_tmp_local_path: '/data/tdt-workspace/helios/response_tmp/'

  app.helios_responses_error_path: '/data/tdt-workspace/helios/response_error/'

  app.helios_sending_destination: '/entree/'

  app.helios_passtrans_server: 'ftp_passtrans'
  app.helios_passtrans_port: '8022'
  app.helios_passtrans_passive_mode: 'true'
  app.helios_passtrans_connection_mode: 'SIMULATEUR'
  app.helios_passtrans_login: 'helios-passtrans'
  app.helios_passtrans_password: 'helios-passtrans'
  app.helios_passtrans_sending_destination: '/entree/'
  app.helios_passtrans_response_server_path: '/sortie/'
  app.helios_ftp_p_appli: 'GHELPES2'


services:
  S2low\Command\Helios\Workers\HeliosAnalyseFichierAEnvoyerCommand:
    public: true
    autowire: true
