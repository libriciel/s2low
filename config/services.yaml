# config/services.yaml

parameters:
  app.database_name: '%env(POSTGRES_DB)%'
  app.database_host: '%env(POSTGRES_HOST)%'
  app.database_login: '%env(POSTGRES_USER)%'
  app.database_password: '%env(POSTGRES_PASSWORD)%'
  app.relative_legacy_ssl_path: 'public.ssl/'
  app.old_timestamp_token_directory: '/data/timestamp-token/'            #TODO : utiliser OLD_TIMESTAMP_TOKEN_DIRECTORY
  app.timestamp_token_retention_nb_days: 781                             #TODO : utiliser HELIOS_RETENTION_RETOURS_NB_JOURS
  app.helios_files_upload_root: '/data/tdt-workspace/helios/sending/'    #TODO : utiliser les variables d'environnement
  app.default_use_prod_notifications: false
  app.use_prod_notifications: '%env(bool:default:app.default_use_prod_notifications:USE_PROD_NOTIFICATIONS)%'
  app.default_actes_appli_trigramme: 'abc'
  app.actes_appli_trigramme: '%env(default:app.default_actes_appli_trigramme:ACTES_APPLI_TRIGRAMME)%'
  app.helios_ftp_p_appli: '%env(HELIOS_FTP_P_APPLI)%'
  app.helios_ftp_server: '%env(HELIOS_FTP_SERVER)%'
  app.helios_ftp_port: '%env(HELIOS_FTP_PORT)%'
  app.helios_ftp_passive_mode: '%env(HELIOS_FTP_PASSIVE_MODE)%'
  app.helios_ftp_connection_mode: '%env(HELIOS_FTP_CONNECTION_MODE)%'
  app.helios_ftp_login: '%env(HELIOS_FTP_LOGIN)%'
  app.helios_ftp_password: '%env(HELIOS_FTP_PASSWORD)%'
  app.helios_ftp_response_server_path: '%env(HELIOS_FTP_RESPONSE_SERVER_PATH)%'
  app.helios_ftp_response_tmp_local_path: '/data/tdt-workspace/helios/response_tmp/'
  app.helios_responses_error_path: '/data/tdt-workspace/helios/response_error/'
  app.helios_sending_destination: '%env(HELIOS_SENDING_DESTINATION)%'
  app.helios_passtrans_server: '%env(HELIOS_PASSTRANS_SERVER)%'
  app.helios_passtrans_port: '%env(HELIOS_PASSTRANS_PORT)%'
  app.helios_passtrans_passive_mode: '%env(HELIOS_PASSTRANS_PASSIVE_MODE)%'
  app.helios_passtrans_connection_mode: '%env(HELIOS_PASSTRANS_CONNECTION_MODE)%'
  app.helios_passtrans_login: '%env(HELIOS_PASSTRANS_LOGIN)%'
  app.helios_passtrans_password: '%env(HELIOS_PASSTRANS_PASSWORD)%'
  app.helios_passtrans_sending_destination: '%env(HELIOS_PASSTRANS_SENDING_DESTINATION)%'
  app.helios_passtrans_response_server_path: '%env(HELIOS_PASSTRANS_RESPONSE_SERVER_PATH)%'
  app.beanstalkd_server: '%env(BEANSTAKLD_SERVER)%'
  app.beanstalkd_port: '%env(BEANSTAKLD_PORT)%'
  app.redis_server: '%env(REDIS_SERVER)%'
  app.redis_port: '%env(REDIS_PORT)%'
  app.database_name : '%env(DB_DATABASE)%'
  app.database_host : '%env(DB_HOST)%'
  app.database_login : '%env(DB_USER)%'
  app.database_password : '%env(DB_PASSWORD)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

# ---------------------------------------------------------------------------------------------------------------------
# Namespace s2low : contient le code développé après le passage en Symfony.
# ---------------------------------------------------------------------------------------------------------------------
  S2low\:
    resource: '../src/*'
    exclude: '../src/Kernel.php'

  S2low\Command\RebuildQueueCommand:
    arguments:
      - !tagged_iterator s2low.queue_rebuilding_worker



  S2low\Services\LogTimestampTokenGarbage:
    arguments:
      $old_timestamp_token_directory: '%app.old_timestamp_token_directory%'
      $timestamp_token_retention_nb_days: '%app.timestamp_token_retention_nb_days%'

  S2low\Services\Helios\FTPHeliosReceiverFactory:
    arguments:
      $helios_ftp_response_tmp_local_path: "%app.helios_ftp_response_tmp_local_path%"
      $helios_responses_error_path: "%app.helios_responses_error_path%"

  S2low\Services\Helios\DGFiPConnection\DGFiPConnectionConfiguration:
    autowire: false

  S2low\Services\Helios\DGFiPConnection\PasstransConnection:
    class: S2low\Services\Helios\DGFiPConnection\DGFiPConnectionConfiguration
    arguments:
      $server: "%app.helios_passtrans_server%"
      $port: "%app.helios_passtrans_port%"
      $login: "%app.helios_passtrans_login%"
      $password: "%app.helios_passtrans_password%"
      $connectionMode: "%app.helios_passtrans_connection_mode%"
      $passiveMode: "%app.helios_passtrans_passive_mode%"
      $sendingDestination: "%app.helios_passtrans_sending_destination%"
      $responseServerPath: "%app.helios_passtrans_response_server_path%"
      $helios_ftp_p_appli: "%app.helios_ftp_p_appli%"

  S2low\Services\Helios\DGFiPConnection\GatewayConnection:
    class: S2low\Services\Helios\DGFiPConnection\DGFiPConnectionConfiguration
    arguments:
      $server: "%app.helios_ftp_server%"
      $port: "%app.helios_ftp_port%"
      $login: "%app.helios_ftp_login%"
      $password: "%app.helios_ftp_password%"
      $connectionMode: "%app.helios_ftp_connection_mode%"
      $passiveMode: "%app.helios_ftp_passive_mode%"
      $sendingDestination: "%app.helios_sending_destination%"
      $responseServerPath: "%app.helios_ftp_response_server_path%"
      $helios_ftp_p_appli: "%app.helios_ftp_p_appli%"

  S2low\Services\Helios\DGFiPConnection\DGFiPConnectionsManager:
    arguments:
      $passtransConnection: '@S2low\Services\Helios\DGFiPConnection\PasstransConnection'
      $gatewayConnection: '@S2low\Services\Helios\DGFiPConnection\GatewayConnection'

  S2low\Legacy\LegacyRouteLoader:
    tags: [ routing.loader ]
    arguments:
      $project_dir: '%kernel.project_dir%'
      $relative_legacy_ssl_path: '%app.relative_legacy_ssl_path%'

  S2low\Controller\LegacyController:
    public: true

  S2low\Controller\HeliosAdminController:
    arguments:
      $helios_ftp_p_appli: '%app.helios_ftp_p_appli%'

  # ---------------------------------------------------------------------------------------------------------------------
  # Namespace Legacy : contient du code legacy correspondant au mail sécurisé
  # Voué à être intégré dans le namespace S2lowLegacy
  # ---------------------------------------------------------------------------------------------------------------------
  Legacy\:
    resource: '../public.ssl/modules/mail/lib/'
    exclude: '../public.ssl/modules/mail/lib/mailfunction.php'
    autowire: true
    autoconfigure: true
    public: true

  # ---------------------------------------------------------------------------------------------------------------------
  # Namespace  S2lowLegacy : contient le code Legacy
  # ---------------------------------------------------------------------------------------------------------------------
  S2lowLegacy\Controller\:
    resource: '../controller/*'
    autowire: false
    autoconfigure: false
    public: false

  S2lowLegacy\Controller\Controller:
    public: true

  S2lowLegacy\Lib\:
    resource: '../lib/*'
    autowire: true
    autoconfigure: true
    public: true

  S2lowLegacy\Lib\ObjectInstancier:
    factory: [ '\S2lowLegacy\Class\LegacyObjectsManager','getObjectInstancier' ]

  S2lowLegacy\Lib\OpenStackContainerStore:
    public: true
    factory: [ '\S2lowLegacy\Class\LegacyObjectsManager','getObject' ]
    arguments: [ 'S2lowLegacy\Lib\OpenStackContainerStore' ]

  S2lowLegacy\SigTermHandler:
    autowire: false #Utilisation de la constante SIGTERM

  S2lowLegacy\Lib\Environnement:
    factory: [ '\S2lowLegacy\Class\LegacyObjectsManager','getObject' ]
    arguments: [ 'S2lowLegacy\Lib\Environnement' ]

  S2lowLegacy\Lib\FrontController:
