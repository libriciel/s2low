parameters:
  # Parametres a definir obligatoirement
  app.database_host: '%env(POSTGRES_HOST)%'
  app.database_login: '%env(POSTGRES_USER)%'
  app.database_name: '%env(POSTGRES_DB)%'
  app.database_password: '%env(POSTGRES_PASSWORD)%'
  app.helios_sending_destination: '%env(HELIOS_SENDING_DESTINATION)%'

  # Parametres avec des valeurs par default
  app.actes_appli_quadrigramme: '%env(default:app.actes_appli_quadrigramme.default:ACTES_APPLI_QUADRIGRAMME)%'
  app.actes_appli_trigramme: '%env(default:app.actes_appli_trigramme.default:ACTES_APPLI_TRIGRAMME)%'
  app.actes_imap_host: '%env(default:app.actes_imap_host.default:ACTES_IMAP_HOST)%'
  app.actes_imap_login: '%env(default:app.actes_imap_login.default:ACTES_IMAP_LOGIN)%'
  app.actes_imap_options: '%env(default:app.actes_imap_options.default:ACTES_IMAP_OPTIONS)%'
  app.actes_imap_password: '%env(default:app.actes_imap_password.default:ACTES_IMAP_PASSWORD)%'
  app.actes_imap_port: '%env(default:app.actes_imap_port.default:ACTES_IMAP_PORT)%'
  app.beanstalkd_port: '%env(default:app.beanstalkd_port.default:BEANSTAKLD_PORT)%'
  app.beanstalkd_server: '%env(default:app.beanstalkd_server.default:BEANSTAKLD_SERVER)%'
  app.convert_api_logins_from_iso: '%env(bool:default:app.convert_api_logins_from_iso.default:CONVERT_API_LOGINS_FROM_ISO)%'
  app.helios_use_passtrans_as_default: '%env(bool:default:app.helios_use_passtrans_as_default.default:HELIOS_USE_PASSTRANS_AS_DEFAULT)%'
  app.image_for_stamp: '%env(default:app.image_for_stamp.default:IMAGE_FOR_STAMP)%'
  app.log.file: '%env(string:default:app.log.file.default:LOG_FILE)%'
  app.mail.dsn: '%env(string:default:app.mail.dsn.default:MAILER_DSN)%'
  app.mail.message: '%env(default:app.mail.message.default:MAIL_MESSAGE)%'
  app.mail.secure_description: '%env(default:app.mail.secure_description.default:MAIL_SECURE_DESCRIPTION)%'
  app.mail.tedetis_from: '%env(default:app.mail.tedetis_from.default:MAIL_TEDETIS_FROM)%'
  app.mail.use_legacy_secure_mail: '%env(bool:default:app.mail.use_legacy_secure_mail.default:USE_LEGACY_SECURE_MAIL_FIELDS)%'
  app.only_use_validcargs: '%env(bool:default:app.only_use_validcargs.default:ONLY_USE_VALIDCARGS)%'
  app.openstack_enable: '%env(bool:default:app.openstack_enable.default:OPENSTACK_ENABLE)'
  app.pdf_stamp_url: '%env(default:app.pdf_stamp_url.default:PDF_STAMP_URL)%'
  app.redis_port: '%env(default:app.redis_port.default:REDIS_PORT)%'
  app.redis_server: '%env(default:app.redis_server.default:REDIS_SERVER)%'
  app.use_legacy_bordereau_model: '%env(bool:default:app.use_legacy_bordereau_model.default:USE_LEGACY_BORDEREAU_MODEL)%'
  app.use_prod_notifications: '%env(bool:default:app.use_prod_notifications.default:USE_PROD_NOTIFICATIONS)%'
  app.workspace_directory: '%env(default:app.workspace_directory.default:WORKSPACE_DIRECTORY)%'
  app.service_name: '%env(default:app.service_name.default:SERVICE_NAME)%'
  app.log_path: '%env(default:app.log_path.default:LOG_PATH)%'
  app.helios_retention_fichiers_nb_jours: '%env(default:app.helios_retention_fichiers_nb_jours_default:HELIOS_RETENTION_FICHIERS_NB_JOURS)%'

  # Valeurs par default de parametres
  app.actes_appli_quadrigramme.default: 'TACT'
  app.actes_appli_trigramme.default: 'abc'
  app.actes_imap_host.default: 'mail'
  app.actes_imap_login.default: 's2low@s2low.docker.libriciel.fr'
  app.actes_imap_options.default: '/imap/notls/novalidate-cert'
  app.actes_imap_password.default: 'password'
  app.actes_imap_port.default: 143
  app.beanstalkd_port.default: 11300
  app.beanstalkd_server.default: 'beanstalkd'
  app.convert_api_logins_from_iso.default: false
  app.helios_use_passtrans_as_default.default: false
  app.image_for_stamp.default: '%kernel.project_dir%/public.ssl/custom/images/s2low-stamp.png'
  app.log.file.default: '%app.log_path%s2low.log'
  app.mail.dsn.default: 'smtp://maildev:1025?verify_peer=0'
  app.mail.message.default: 'Vous avez reçu un courrier recommandé par S2LOW'
  app.mail.secure_description.default: 'ne-pas-repondre'
  app.mail.tedetis_from.default: 's2low-mailsec@s2low.docker.libriciel.fr'
  app.mail.use_legacy_secure_mail.default: false
  app.only_use_validcargs.default: false
  app.openstack_enable.default: false
  app.pdf_stamp_url.default: 'http://pdf-stamp:8080'
  app.redis_port.default: 6379
  app.redis_server.default: 'redis'
  app.use_legacy_bordereau_model.default: true
  app.use_prod_notifications.default: false
  app.service_name.default: 'app'
  app.log_path.default: '/data/log/'
  app.helios_retention_fichiers_nb_jours_default: 3650000

  # Variables Globale
  app.actes.files_upload_root: '%app.workspace_directory%actes/uploads'
  app.actes_enveloppe_sans_transaction: '%app.workspace_directory%actes/sans_transaction'
  app.actes_response_error_path: '%app.workspace_directory%actes/response_error'
  app.actes_response_tmp_local_path: '%app.workspace_directory%actes/response_tmp'
  app.actes_ministere_acronyme: 'MI'
  app.database_json_definition_file_path: '%kernel.project_dir%/db/s2low.sql.json'
  app.database_sql_definition_filepath: '%kernel.project_dir%/db/s2low.sql'
  app.helios_counter_file: '%app.helios_file_root%counter.txt'
  app.helios_file_root: '%app.workspace_directory%helios/'
  app.helios_files_upload_root: '/data/tdt-workspace/helios/sending/'
  app.helios_ftp_response_tmp_local_path: '/data/tdt-workspace/helios/response_tmp/'
  app.helios_ocre_file_path: '%app.helios_file_root%ocre/'
  app.helios_repertoire_pes_aller_sans_transaction: '%app.helios_file_root%orphelins/'
  app.helios_responses_root: '%app.helios_file_root%response/'
  app.helios_responses_error_path: '/data/tdt-workspace/helios/response_error/'
  app.mail_file_upload_root: '%app.workspace_directory%mail/'
  app.mail_files_without_transac_dir: '%app.mail_file_upload_root%sans_transaction/'
  app.old_timestamp_token_directory: '/data/timestamp-token/'
  app.openssl_path: '/usr/bin/openssl'
  app.pades_valid_url: 'http://pades-valid:8080'
  app.path_to_rgs_valid_ca: '/etc/s2low/ssl/validca/'
  app.path_to_rgs_valid_cargs: '/etc/s2low/ssl/validcargs/'
  app.relative_legacy_ssl_path: 'public.ssl/'
  app.schema_pes_path: '%kernel.project_dir%/xsd/schemas_pes_v5.24/'
  app.timestamp_token_retention_nb_days: 781
  app.truststore_path: '/data/certificate/truststore/'
  app.website: 'http://s2low.docker.libriciel.fr/'
  app.website_ssl: 'https://s2low.docker.libriciel.fr/'
  app.workspace_directory.default: '/data/tdt-workspace/'
  app.xmlsec_path: '/usr/bin/xmlsec1'
services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $actes_appli_quadrigramme: '%app.actes_appli_quadrigramme%'
      $actes_appli_trigramme: '%app.actes_appli_trigramme%'
      $actes_files_upload_root: '%app.actes.files_upload_root%'
      $actes_ministere_acronyme: '%app.actes_ministere_acronyme%'
      $actes_response_error_path: '%app.actes_response_error_path%'
      $actes_response_tmp_local_path: '%app.actes_response_tmp_local_path%'
      $database_json_definition_filepath: '%app.database_json_definition_file_path%'
      $database_sql_definition_filepath: '%app.database_sql_definition_filepath%'
      $environment: '%kernel.environment%'
      $fromDescription: '%app.mail.secure_description%'
      $helios_files_upload_root: '%app.helios_files_upload_root%'
      $helios_responses_root: '%app.helios_responses_root%'
      $mail_files_upload_root: '%app.mail_file_upload_root%'
      $opensslPath: '%app.openssl_path%'
      $projectDirectory: '%kernel.project_dir%'
      $rgs_validca_path: '%app.path_to_rgs_valid_ca%'
      $s2lowFromMail: '%app.mail.tedetis_from%'
      $subject: '%app.mail.message%'
      $tdt_from_email: '%app.mail.tdt_from_email%'
      $use_prod_notifications: '%app.use_prod_notifications%'
      $website: '%app.website%'

  monolog.formatter.line:
    class: Monolog\Formatter\LineFormatter
    arguments:
      - "[%%datetime%%] %%extra.service_name%%.%%level_name%%: %%message%% %%context%% {\"pid\":%%extra.pid%%}\n"
      - "c"
      - 'true'

#  rgs_valid_ca_path:
#    class: string
#    factory: [ '@S2low\Factory\RgsValidCaPathFactory', 'create' ]
#    public: false

# ---------------------------------------------------------------------------------------------------------------------
# Namespace s2low : contient le code développé après le passage en Symfony.
# ---------------------------------------------------------------------------------------------------------------------
  S2low\:
    resource: '../src/*'
    exclude: '../src/Kernel.php'

  Psr\Log\LoggerInterface:
    alias: 'logger'
    public: true

  S2lowLegacy\Boot\S2lowBootstrap:
    class: 'S2lowLegacy\Boot\S2lowBootstrap'
    autowire: true
    autoconfigure: true
    public: true

  S2low\Command\RebuildQueueCommand:
    public: true
    arguments:
      - !tagged_iterator s2low.queue_rebuilding_worker

  S2low\Services\LogTimestampTokenGarbage:
    public: true
    arguments:
      $old_timestamp_token_directory: '%app.old_timestamp_token_directory%'
      $timestamp_token_retention_nb_days: '%app.timestamp_token_retention_nb_days%'

  S2low\Services\Helios\FTPHeliosReceiverFactory:
    public: true
    arguments:
      $helios_ftp_response_tmp_local_path: "%app.helios_ftp_response_tmp_local_path%"
      $helios_responses_error_path: "%app.helios_responses_error_path%"

  S2low\Services\Helios\DGFiPConnection\DGFiPConnectionConfiguration:
    autowire: false

  S2low\Services\Helios\DGFiPConnection\PasstransConnection:
    public: true
    class: S2low\Services\Helios\DGFiPConnection\DGFiPConnectionConfiguration
    arguments:
      $server: "%app.helios_passtrans_server%"
      $port: "%app.helios_passtrans_port%"
      $login: "%app.helios_passtrans_login%"
      $password: "%app.helios_passtrans_password%"
      $connectionMode: "%app.helios_passtrans_connection_mode%"
      $passiveMode: "%app.helios_passtrans_passive_mode%"
      $sendingDestination: "%app.helios_passtrans_sending_destination%"
      $responseServerPath: "%app.helios_passtrans_response_server_path%"
      $helios_ftp_p_appli: "%app.helios_ftp_p_appli%"

  S2low\Services\Helios\DGFiPConnection\GatewayConnection:
    public: true
    class: S2low\Services\Helios\DGFiPConnection\DGFiPConnectionConfiguration
    arguments:
      $server: "%app.helios_ftp_server%"
      $port: "%app.helios_ftp_port%"
      $login: "%app.helios_ftp_login%"
      $password: "%app.helios_ftp_password%"
      $connectionMode: "%app.helios_ftp_connection_mode%"
      $passiveMode: "%app.helios_ftp_passive_mode%"
      $sendingDestination: "%app.helios_sending_destination%"
      $responseServerPath: "%app.helios_ftp_response_server_path%"
      $helios_ftp_p_appli: "%app.helios_ftp_p_appli%"

  S2low\Services\Helios\DGFiPConnection\DGFiPConnectionsManager:
    public: true
    arguments:
      $passtransConnection: '@S2low\Services\Helios\DGFiPConnection\PasstransConnection'
      $gatewayConnection: '@S2low\Services\Helios\DGFiPConnection\GatewayConnection'

  S2low\Legacy\LegacyRouteLoader:
    public: true
    tags: [ routing.loader ]
    arguments:
      $project_dir: '%kernel.project_dir%'
      $relative_legacy_ssl_path: '%app.relative_legacy_ssl_path%'

  S2low\Controller\LegacyController:
    public: true

  S2low\Controller\HeliosAdminController:
    public: true
    arguments:
      $helios_ftp_p_appli: '%app.helios_ftp_p_appli%'

  S2lowLegacy\Class\actes\IActesPdf:
    public: true
    factory: ['@S2low\Factory\ActesPdfFactory','create']

  # ---------------------------------------------------------------------------------------------------------------------
  # Factories
  # ---------------------------------------------------------------------------------------------------------------------

  S2low\Factory\ActesPdfFactory:
    public: true
    autowire: true
    autoconfigure: true
    arguments:
      $useLegacyBordereauModel: '%app.use_legacy_bordereau_model%'

  S2low\Factory\MailHeaderFactory:
    public: true
    arguments:
      $mailHeader: '@S2lowLegacy\Mail\MailHeader'
      $mailHeaderLegacy: '@S2lowLegacy\Mail\MailHeaderLegacy'

  S2low\Factory\OpenStackConfigFactory:
    autowire: true
    arguments:
      $cloudProvidersConfig: '%cloud_provider%'

  S2low\Factory\EnvironnementFactory:
    public: true
    arguments:
      $convert_api_logins_from_iso: '%app.convert_api_logins_from_iso%'

  # ---------------------------------------------------------------------------------------------------------------------
  # S2lowLegacy\Mail
  # ---------------------------------------------------------------------------------------------------------------------

  S2lowLegacy\Mail\:
    resource: '../public.ssl/modules/mail/lib/'
    exclude: '../public.ssl/modules/mail/lib/mailfunction.php'
    autowire: false
    autoconfigure: true
    public: true

  S2lowLegacy\Mail\IMailHeader:
    public: true
    factory: ['@S2low\Factory\MailHeaderFactory', 'create']
    arguments:
      $useLegacySecureMailFields: '%app.mail.use_legacy_secure_mail%'

  # ---------------------------------------------------------------------------------------------------------------------
  # Namespace  S2lowLegacy : contient le code Legacy
  # ---------------------------------------------------------------------------------------------------------------------
  S2lowLegacy\Controller\:
    resource: '../controller/*'
    autowire: true
    autoconfigure: true
    public: true

  S2lowLegacy\Lib\:
    resource: '../lib/*'
    autowire: true
    autoconfigure: true
    public: true
    exclude:
      - '../lib/OpenStackConfig.php'

  S2lowLegacy\Lib\SigTermHandler:
    public: true
    shared: true
    autowire: true
    factory: ['S2lowLegacy\Lib\SigTermHandler', 'getInstance']

  S2lowLegacy\Lib\OpenStackContainerFetcher:
    autowire: false #Pas un service, est renvoyé par une factory

  S2lowLegacy\Lib\PesAllerData:
    autowire: false #Pas un service, est renvoyé par une factory

  S2lowLegacy\Lib\Siren:
    autowire: false #Pas un service, est renvoyé par une factory

  S2lowLegacy\Lib\Siret:
    autowire: false #Pas un service, est renvoyé par une factory

  S2lowLegacy\Lib\OpenStackContainerWrapperFactory:
    public: true
    arguments:
      $logger: '@monolog.logger.request'

  S2lowLegacy\Lib\OpenStackSwiftWrapper:
    public: true
    arguments:
      $openstack_enable: '%app.openstack_enable%'

  S2lowLegacy\Lib\X509Certificate:
    autowire: true
    autoconfigure: true
    public: true

  S2lowLegacy\Lib\ParsedownExtended:
    autowire: false #doit être configuré explicitement

  S2lowLegacy\Lib\PemCertificate:
    autowire: false #pas un service

  S2lowLegacy\Lib\Recuperateur:
    autowire: false #pas un service

  S2lowLegacy\Lib\SQLQuery:
    autoconfigure: true
    autowire: true
    public: true

  S2lowLegacy\Lib\SessionWrapper:
    public: true
    factory: ['S2low\Factory\SessionWrapperFactory', 'create']

  S2lowLegacy\Lib\Environnement:
    public: true
    factory: ['@S2low\Factory\EnvironnementFactory', 'create']

  S2lowLegacy\Lib\XadesSignature:
    public: false
    arguments:
      $xmlsec1_path: "%app.xmlsec_path%"

  # ---------------------------------------------------------------------------------------------------------------------
  # Sous Namespace  S2lowLegacy/Model : aucune dépendance, peut être instancié directement par le service container
  # ---------------------------------------------------------------------------------------------------------------------

  S2lowLegacy\Model\:
    resource: '../model/*'
    autowire: true
    autoconfigure: true
    public: true

  S2lowLegacy\Model\MessageAdminSQL:
    public: true
    arguments:
      $cachePath: "/var/run/htmlpurifier"

  # ---------------------------------------------------------------------------------------------------------------------
  # Sous Namespace  S2lowLegacy/Class
  # ---------------------------------------------------------------------------------------------------------------------

  S2lowLegacy\Class\:
    resource: '../class/*'
    exclude:
      - '../class/include.php'
      - '../class/util.php'
    autowire: true
    autoconfigure: true
    public: true

  S2lowLegacy\Class\Antivirus:
    public: true
    arguments:
      $antivirus_command: '%app.antivirus_command%'

  S2lowLegacy\Class\BatchUploadHandler:
    public: true
    autowire: false

  S2lowLegacy\Class\BeanstalkdWrapper:
    public: true
    arguments:
      $beanstalkd_server: "%app.beanstalkd_server%"
      $beanstalkd_port: "%app.beanstalkd_port%"

  S2lowLegacy\Class\CloudStorage:
    autowire: false
    autoconfigure: false
    public: false

  S2lowLegacy\Class\EncodingManager:
    autowire: false
    autoconfigure: false
    public: false

  S2lowLegacy\Class\FailedControllerActionException:
    autowire: false
    autoconfigure: false
    public: false

  S2lowLegacy\Class\InitData:
     autowire: false
     autoconfigure: false
     public: false

  S2lowLegacy\Class\ModuleData:
    autowire: false
    autoconfigure: false
    public: false

  S2lowLegacy\Class\helios\HeliosFilesNames:
    autowire: false
    autoconfigure: false
    public: false

  S2lowLegacy\Class\helios\HeliosSAEDateManager:
    public: true
    arguments:
      $helios_retention_fichiers_nb_jours: '%app.helios_retention_fichiers_nb_jours%'

  S2lowLegacy\Class\helios\PESAllerCloudStorable:
    public: true
    arguments:
      $repertoirePesAllerSansTransaction: '%app.helios_repertoire_pes_aller_sans_transaction%'

  S2lowLegacy\Class\helios\PESAllerCloudStorage:
    public: true
    arguments:
      $logger: '@monolog.logger.request'
      $openstack_enable: '%app.openstack_enable%'

  S2lowLegacy\Class\DataObjectSaveSQLRequest: # TODO :verify
    autowire: false

  S2lowLegacy\Class\DatePicker: # TODO :verify
    autowire: false

  S2lowLegacy\Class\Mailer: #TODO Impossible pour l'instant ( chargé par PEAR )
    autowire: false

  S2lowLegacy\Class\PearMail: #TODO Impossible pour l'instant ( chargé par PEAR )
    autowire: false

  S2lowLegacy\Class\PdfStampMessages:
    autowire: false

  S2lowLegacy\Class\ModulePermission: #Impossible : doit nécésairement être paramétré par module
    autowire: false

  S2lowLegacy\Class\PDFStampWrapper:
    public: true
    arguments:
      $pdf_stamp_url: '%app.pdf_stamp_url%'
      $image_for_stamp: '%app.image_for_stamp%'

  S2lowLegacy\Class\QueryResult:
    autowire: false

  S2lowLegacy\Class\PadesValid:
    public: true
    arguments:
      $pades_valid_url: "%app.pades_valid_url%"

  S2lowLegacy\Class\RedisMutexWrapper:
    public: true
    arguments:
      $redis_server: "%app.redis_server%"
      $redis_port: "%app.redis_port%"

  S2lowLegacy\Class\S2lowRedirect:
    public: true
    arguments:
      $website_ssl: "%app.website_ssl%"
      $website: "%app.website%"

  S2lowLegacy\Class\TGZExtractor:
    autowire: false

  S2lowLegacy\Class\VerifyPKCS7Signature:
    autowire: false

  S2lowLegacy\Class\VerifyPemCertificate:
    autowire: false

  S2lowLegacy\Class\Versionning:
    autowire: false

  S2lowLegacy\Class\CustomizableWorkerRunner:
    autowire: false

  S2lowLegacy\Class\JobFetcherFromDB:
    autowire: false

  S2lowLegacy\Class\WorkerRunnerWithDataFromBeanstalkd:
    autowire: false

  S2lowLegacy\Class\JobFetcherFromSelfUpdatedBeanstalkd:
    autowire: false

  S2lowLegacy\Class\XSDValidation:
    autowire: false

  S2lowLegacy\Class\actes\ActesMinistereProperties:
    public: true
    arguments:
      $url: '%actes.ministere.url%'
      $authentification_type: '%actes.ministere.authentification_type%'
      $login: '%actes.ministere.login%'
      $password: '%actes.ministere.password%'
      $client_certificate: '%actes.ministere.client_certificat%'
      $client_certificate_key: '%actes.ministere.client_certificate_key%'
      $client_certificate_key_password: '%actes.ministere.client_certificate_key_password%'
      $adapt_protocol: '%actes.ministere.adapt_protocol%'
      $server_certificate_path: '%actes.ministere.server_certificate_path%'
      $use_legacy_protocol: '%actes.use_legacy_protocol%'

  S2lowLegacy\Class\actes\ActesAntivirusWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\actes\ActesAnalyseFichierAEnvoyerWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\actes\ActesEnvoiFichierWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\actes\ActesAnalyseFichierRecuWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\actes\ActesEnvoiSaeWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\actes\ClassificationString:
    public: true
    autowire: false

  S2lowLegacy\Class\actes\ActesImapProperties:
    public: true
    autowire: true
    arguments:
      $host: '%app.actes_imap_host%'
      $port: '%app.actes_imap_port%'
      $login: '%app.actes_imap_login%'
      $password: '%app.actes_imap_password%'
      $imap_options: '%app.actes_imap_options%'

  S2lowLegacy\Class\actes\ActesFiles:
    autowire: false

  S2low\Services\Helios\HeliosAnalyseFichierAEnvoyerWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\helios\HeliosAnalyseFichierRecuWorker:
    public: true
    tags: ['s2low.queue_rebuilding_worker']

  S2lowLegacy\Class\actes\ActesArchive:
    autowire: false #Pas un service ??

  S2lowLegacy\Class\actes\ActesCloudStorage:
    public: true
    arguments:
      $logger: '@monolog.logger.request'
      $openstack_enable: '%app.openstack_enable%'

  S2lowLegacy\Class\actes\ActesFileSender:
    public: true
    arguments:
      $trustore_path: '%app.truststore_path%'

  S2lowLegacy\Class\Parapheur:
    autowire: false #Initialisé avec les données à traiter ...

  S2lowLegacy\Class\actes\ActesNameArchive:
    public: true
