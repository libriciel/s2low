<VirtualHost *:80>
    ServerAdmin root@localhost
    ServerName localhost
    ServerAlias *

    DocumentRoot /var/www/s2low/public
    Header always append X-Frame-Options SAMEORIGIN

    <Directory /var/www/s2low/public>
        Options +FollowSymLinks -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteCond %{REQUEST_URI} !/.well-known/acme-challenge/
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}

    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ http://letsencrypt:80/
    ProxyPassReverse /.well-known/acme-challenge/ http://letsencrypt:80/

</VirtualHost>

<VirtualHost *:443>
    ServerAdmin root@localhost
    ServerName localhost
    ServerAlias *
    DocumentRoot /var/www/s2low/public.ssl
    <Directory /var/www/s2low/public.ssl>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
     </Directory>

    #PHP
    php_admin_value max_file_uploads 200
    php_admin_value upload_max_filesize 150M
    php_admin_value post_max_size 150M
    php_admin_flag mail.add_x_header off

    #LOGS
    LogLevel info

    #SSL
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem
    # Configuration SSL authentification utilisateurs
    SSLCACertificatePath  /etc/s2low/ssl/validca
    SSLCARevocationPath /etc/s2low/ssl/validca
    SSLCARevocationCheck chain
    SSLSessionCacheTimeout 1500
    SSLCipherSuite ECDH+AES:+AES128:+AES256:+SHA
    SSLHonorCipherOrder on
    SSLProtocol all -SSLv2 -SSLv3
    SSLCompression off

    SSLInsecureRenegotiation on
    SSLOptions +StdEnvVars +OptRenegotiate +ExportCertData +LegacyDNStringFormat

	<Directory /var/www/s2low/public.ssl>
       	SSLRenegBufferSize 104860000
		SSLVerifyClient require
        SSLVerifyDepth 5
        Options -Indexes
		Order allow,deny
		allow from all
	</Directory>

	<Directory /var/www/s2low/public.ssl/libersign>
        	SSLVerifyClient none
	        Options -Indexes +FollowSymLinks
	        Order   allow,deny
	        Allow   from all
	</Directory>

	ExpiresActive On

    <filesMatch "\.(ico|pdf|flv|jpg|jpeg|png|gif|js|css|swf|css)$">
        ExpiresDefault "access plus 5 minutes"
        Header set Cache-Control "max-age=300, must-revalidate"
    </filesMatch>


</VirtualHost>
