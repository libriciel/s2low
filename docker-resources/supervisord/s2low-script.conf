
# Ce script est utilise dans la procedure d'install, ne pas effacer...

[eventlistener:process-failed]
command=php /var/www/s2low/cron/process-failed.php
events=PROCESS_STATE_FATAL
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=unexpected
env=HOME="/var/www"
directory=/var/www

[program:actes-antivirus]
command=php /var/www/s2low/bin/console actes:antivirus
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-analyse-fichier-a-envoyer]
command=php /var/www/s2low/bin/console actes:analyse-fichier-a-envoyer
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-envoi-fichier]
command=php /var/www/s2low/bin/console actes:envoi-fichier
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-envoi-ar]
command=php /var/www/s2low/bin/console actes:envoi-ar
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-reception-fichier]
command=php /var/www/s2low/bin/console actes:reception-fichier
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-analyse-fichier-recu]
command=php /var/www/s2low/bin/console actes:analyse-fichier-recu
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-notification]
command=php /var/www/s2low/bin/console actes:notification
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-prepare-sae]
command=timeout -k 60 3600 php /var/www/s2low/bin/console actes:prepare-sae
autorestart=true
directory=/var/www
env=HOME="/var/www"


[program:actes-envoi-sae]
command=timeout -k 60 3600 php /var/www/s2low/cron/actes-envoi-sae.php
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:actes-verif-transfert-sae]
command=timeout -k 60 3600 php /var/www/s2low/cron/actes-verif-transfert-sae.php
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-analyse-envoi]
command=timeout -k 60 720 php /var/www/s2low/bin/console helios:analyse-fichier-a-envoyer
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-envoi]
command=php /var/www/s2low/bin/console helios:envoi
numprocs=%(ENV_HELIOS_NB_FILES_ENVOI)s
process_name = %(program_name)s_%(process_num)02d
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-envoi-passtrans]
command=php /var/www/s2low/bin/console helios:envoi --usePasstrans
numprocs=%(ENV_HELIOS_NB_FILES_ENVOI_PASSTRANS)s
process_name = %(program_name)s_%(process_num)02d
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-reception]
command=php /var/www/s2low/bin/console helios:reception
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-reception-passtrans]
command=php /var/www/s2low/bin/console helios:reception --usePasstrans
autostart=%(ENV_HELIOS_PASSTRANS_RECEPTION_ENABLE)s
autorestart=%(ENV_HELIOS_PASSTRANS_RECEPTION_ENABLE)s
directory=/var/www
env=HOME="/var/www"

[program:helios-analyse-reception]
command=php /var/www/s2low/cron/helios-analyse-fichier-recu.php
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-prepare-sae]
command=timeout -k 60 3600 php /var/www/s2low/cron/helios-prepare-sae.php
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-envoi-sae]
command=timeout -k 60 3600 php /var/www/s2low/cron/helios-envoi-sae.php
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-verif-transfert-sae]
command=timeout -k 60 3600 php /var/www/s2low/cron/helios-verif-transfert-sae.php
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:helios-purge]
command=php /var/www/s2low/script/helios/helios-purge-transaction.php do
autostart=%(ENV_HELIOS_PURGE_ENABLE)s
autorestart=%(ENV_HELIOS_PURGE_ENABLE)s

[program:journal-vidange]
command=php /var/www/s2low/cron/journal-vidange.php
autorestart=true
directory=/var/www
env=HOME="/var/www"


[program:journal-request]
command=php /var/www/s2low/bin/console cron:journal-request
autorestart=true
directory=/var/www
env=HOME="/var/www"

[program:recup_crl]
command=php /var/www/s2low/cron/certificats-recuperateur.php
autorestart=true
