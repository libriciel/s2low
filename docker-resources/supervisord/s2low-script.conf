
# Ce script est utilise dans la procedure d'install, ne pas effacer...

[eventlistener:process-failed]
command=php /var/www/s2low/bin/console worker:process-failed
events=PROCESS_STATE_FATAL
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=unexpected
environment=SERVICE_NAME="process-failed"
directory=/var/www
stdout_logfile=/dev/null
stderr_logfile=/dev/null

