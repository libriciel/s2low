/data/log/*.log {
	daily
	missingok
	rotate 14
	compress
	delaycompress
	notifempty
	create 640 www-data www-data
    postrotate
        /usr/bin/kill -s SIGUSR2 $(cat /data/run/supervisord.pid) 2>/dev/null || true
    endscript
}

/data/log/apache2/*.log {
	daily
	missingok
	rotate 14
	compress
	delaycompress
	notifempty
	create 640 www-data www-data
    postrotate
        /usr/sbin/apachectl graceful
    endscript
}