version: '2.0'

services:
    web:
        build: .
        links:
            - simulateur
            - ftp:ftp
            - db_test:db_test
        ports:
            - "${WEB_HTTP_PORT}:80"
            - "${WEB_HTTPS_PORT}:443"
        volumes:
            - .:/var/www/s2low
        environment:
            POSTGRES_HOST_TEST: ${POSTGRES_HOST_TEST}
            POSTGRES_USER_TEST: ${POSTGRES_USER_TEST}
            POSTGRES_PASSWORD_TEST: ${POSTGRES_PASSWORD_TEST}
            POSTGRES_DATABASE_TEST: ${POSTGRES_DATABASE_TEST}

    db_test:
        build:
            context: ./docker-resources/
            dockerfile: Dockerfile-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER_TEST}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_TEST}
            - POSTGRES_DB=${POSTGRES_DATABASE_TEST}
        volumes:
            - ${POSTGRESQL_DATADIR_TEST}:/var/lib/postgresql/data

    phppgadmin:
        image: keepitcool/phppgadmin
        environment:
            - DB_HOST=db
            - DB_PORT=5432
        links:
            - db:db
        ports:
            - "${PHPPGADMIN_HTTP_PORT}:80"

    simulateur:
        image: gitlab.libriciel.fr:4567/s2low/simulateur-helios:master
        #image: simulateurhelios_web
        links:
            - ftp:ftp
            - mail:mail
        ports:
            - ${SIMULATEUR_SITE_PORT}:80
        volumes:
            - ${SIMULATEUR_WORKSPACE_DIRECTORY}:/var/www/simulateur-helios/workspace
        environment:
            MAIL_HOST: mail
            MAIL_PORT: 25
            MAIL_FROM: mail@tedetis.org

    ftp:
        image: mcreations/ftp
        environment:
            FTP_USER: ${HELIOS_FTP_LOGIN}
            FTP_PASS: ${HELIOS_FTP_PASSWORD}
            PASV_MIN_PORT: ${PASV_MIN_PORT}
            PASV_MAX_PORT: ${PASV_MAX_PORT}
        volumes:
          - ${SIMULATEUR_WORKSPACE_DIRECTORY}:/data/${HELIOS_FTP_LOGIN}/
        ports:
          - "${FTP_PORT}:21"
          - "${PASV_MIN_PORT}-${PASV_MAX_PORT}:${PASV_MIN_PORT}-${PASV_MAX_PORT}"

    mail:
        build:
            context: ./docker-resources/
            dockerfile: Dockerfile-mail
        ports:
            - "10143:143"
        environment:
            - MAILNAME=tedetis.org
            - MAIL_ADDRESS=mail@tedetis.org
            - MAIL_PASS=password
