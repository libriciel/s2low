include:

  - project: "libriciel/integration-continue/templates"
    ref: master
    file: '/publish-container-to-registry.yml'

  - project: "libriciel/integration-continue/templates"
    ref: master
    file: '/security-check.yml'

stages:
    - build
    - static-analysis
    - test
    - quality
    - deploy
    - staging
    - production

variables:
    CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}"
    POSTGRES_DB: s2lowdb
    POSTGRES_USER: s2lowuser
    POSTGRES_PASSWORD: s2lowpassword

build:
  stage: build
  tags:
    - docker-build
  script:
    - /bin/bash docker-resources/generate-manifest.sh > manifest.txt
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker build --target s2low_dev --pull -t ${CONTAINER_IMAGE} .
    - docker push ${CONTAINER_IMAGE}

lint:
  stage: static-analysis
  image : "$CONTAINER_IMAGE"
  variables:
    DONT_RETRIEVE_VALIDCA: "true"
    DONT_INIT_DATABASE: "true"
  script:
    - cd /var/www/s2low
    - vendor/bin/phpcs .

unit_test:
    stage: test
    image : "$CONTAINER_IMAGE"
    services:
        - name: gitlab.libriciel.fr:4567/docker/postgres:9.6.5
          alias: postgres
    variables:
        XDEBUG_ON: "true"
        POSTGRES_USER_TEST: s2lowuser
        POSTGRES_PASSWORD_TEST: s2lowpassword
        POSTGRES_DB_TEST: s2lowdb
        POSTGRES_DATABASE_TEST: s2lowdb
        POSTGRES_HOST_TEST: postgres
        POSTGRES_HOST: postgres
        S2LOW_WEBSITE: "localhost"
        COMPOSER_PROCESS_TIMEOUT: 9000
        DONT_RETRIEVE_VALIDCA: "true"
        XDEBUG_MODE: coverage
        APP_ENV: test
        MAILER_DSN: smtp://mailsec:25?verify_peer=0
    script:
        - cd /var/www/s2low/
        - composer test-cover
        - cp -rf coverage $CI_PROJECT_DIR
    artifacts:
      paths:
        - coverage
      expire_in: 1h

quality:
  stage: quality
  only:
    - master
  image : gitlab.libriciel.fr:4567/docker/sonar-scanner:latest
  script:
    - mkdir -p /var/www/s2low
    - cp -rf $CI_PROJECT_DIR/* /var/www/s2low
    - cd /var/www/s2low
    - /sonar-scanner -Dsonar.login=$SONAR_LOGIN -Dsonar.host.url=$SONAR_HOST_URL


security_scan:
  allow_failure: true
  before_script:
    - cp .trivyignore /

deploy_app:
    stage: staging
    only:
        - master
    variables:
        PAYLOAD: "payload={\"text\": \"[s2low-5-0.dev.libriciel.net](https://s2low-5-0.dev.libriciel.net) a été mis à jour - [build $CI_PIPELINE_ID]($CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID)\"}"
    script:
        - eval $(ssh-agent -s)
        - ssh-add <(echo "$SSH_PRIVATE_KEY")
        - mkdir -p ~/.ssh
        - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
        - scp ./docker-compose.yml s2low@s2low-5-0.dev.libriciel.net:/opt/s2low/
        - scp ./docker-compose.simulateur.yml s2low@s2low-5-0.dev.libriciel.net:/opt/s2low/docker-compose.override.yml
        - echo "$DEV_ENV_FILE" > /tmp/.env
        - scp /tmp/.env s2low@s2low-5-0.dev.libriciel.net:/opt/s2low/
        - ssh -tt s2low@s2low.test.libriciel.fr "docker login -u gitlab-ci-token -p '$CI_JOB_TOKEN' $CI_REGISTRY && cd /opt/s2low/ && docker-compose pull && docker-compose up -d"
        - curl -i -X POST -d "$PAYLOAD" $MATTERMOST_WEBHOOK

deploy_ftp:
    stage: production
    only:
      - tags
    image : "$CONTAINER_IMAGE"
    services:
        - name: gitlab.libriciel.fr:4567/docker/postgres:9.6.5
          alias: postgres

    variables:
        TARBALL_NAME: s2low-${CI_COMMIT_REF_NAME}.tar.gz
        PAYLOAD: "payload={\"text\": \"[s2low] Création de la version [$CI_COMMIT_REF_NAME](http://ressources.libriciel.fr/s2low/s2low-${CI_COMMIT_REF_NAME}.tar.gz)\"}"
        XDEBUG_ON: "true"
        POSTGRES_USER_TEST: s2lowuser
        POSTGRES_PASSWORD_TEST: s2lowpassword
        POSTGRES_DB_TEST: s2lowdb
        POSTGRES_DATABASE_TEST: s2lowdb
        POSTGRES_HOST_TEST: postgres
        POSTGRES_HOST: postgres
        S2LOW_WEBSITE: "localhost"
    before_script:
        - apt-get -qq update && apt-get -yqq install openssh-client lftp
        - mkdir -p ~/.ssh
        - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    script:
        - cd /var/www/ && tar cvzf /tmp/${TARBALL_NAME} s2low
        - lftp -p 2222 -u "s2low","${RESSOURCE_LIBRICIEL_FTP_PASSWD}"  "sftp://ressources.libriciel.fr/s2low" -e "put /tmp/${TARBALL_NAME}; bye"
        - curl -i -X POST -d "$PAYLOAD" $MATTERMOST_WEBHOOK
