include:

  - project: "libriciel/integration-continue/templates"
    ref: master
    file: '/publish-container-to-registry.yml'

stages:
    - build
    - test
    - deploy
    - staging
    - production

variables:
    CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}"
    POSTGRES_DB: s2lowdb
    POSTGRES_USER: s2lowuser
    POSTGRES_PASSWORD: s2lowpassword

build:
  stage: build
  tags:
    - docker-build
  script:
    - /bin/bash docker-resources/generate-manifest.sh > manifest.txt
    - mkdir -p ./ext/standalone/HTMLPurifier/DefinitionCache/Serializer
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker build --target s2low_dev --pull -t ${CONTAINER_IMAGE} .
    - docker push ${CONTAINER_IMAGE}

unit_test:
    stage: test
    image : "$CONTAINER_IMAGE"
    services:
        - name: gitlab.libriciel.fr:4567/docker/postgres:9.6.5
          alias: postgres
    variables:
        XDEBUG_ON: "true"
        POSTGRES_USER_TEST: s2lowuser
        POSTGRES_PASSWORD_TEST: s2lowpassword
        POSTGRES_DB_TEST: s2lowdb
        POSTGRES_DATABASE_TEST: s2lowdb
        POSTGRES_HOST_TEST: postgres
        POSTGRES_HOST: postgres
        S2LOW_WEBSITE: "localhost"
        COMPOSER_PROCESS_TIMEOUT: 9000
        DONT_RETRIEVE_VALIDCA: "true"
        XDEBUG_MODE: coverage
    script:
        - cd /var/www/s2low/
        - composer test-cover

deploy_app:
    stage: staging
    only:
        - master
    variables:
        PAYLOAD: "payload={\"text\": \"[s2low.test.libriciel.fr](https://s2low.test.libriciel.fr) a été mis à jour - [build $CI_PIPELINE_ID]($CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID)\"}"

    script:
        - eval $(ssh-agent -s)
        - ssh-add <(echo "$SSH_PRIVATE_KEY")
        - mkdir -p ~/.ssh
        - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
        - scp ./docker-compose.yml s2low@s2low.test.libriciel.fr:/data/s2low/docker-file
        - scp ./docker-compose.simulateur.yml s2low@s2low.test.libriciel.fr:/data/s2low/docker-file/docker-compose.override.yml
        - echo "$STAGING_ENV_FILE_CONTENT" > /tmp/.env
        - scp /tmp/.env s2low@s2low.test.libriciel.fr:/data/s2low/docker-file/
        - scp ./docker-resources/Dockerfile* ./docker-resources/docker_postgres.sh s2low@s2low.test.libriciel.fr:/data/s2low/docker-file/docker-resources
        - ssh -tt s2low@s2low.test.libriciel.fr "docker login -u gitlab-ci-token -p '$CI_JOB_TOKEN' $CI_REGISTRY && cd /data/s2low/docker-file/  && docker-compose pull && docker-compose up -d"
        - curl -i -X POST -d "$PAYLOAD" $MATTERMOST_WEBHOOK

deploy_ftp:
    stage: production
    only:
      - tags
    image : "$CONTAINER_IMAGE"
    services:
        - name: gitlab.libriciel.fr:4567/docker/postgres:9.6.5
          alias: postgres

    variables:
        TARBALL_NAME: s2low-${CI_COMMIT_REF_NAME}.tar.gz
        PAYLOAD: "payload={\"text\": \"[s2low] Création de la version [$CI_COMMIT_REF_NAME](http://ressources.libriciel.fr/s2low/s2low-${CI_COMMIT_REF_NAME}.tar.gz)\"}"
        XDEBUG_ON: "true"
        POSTGRES_USER_TEST: s2lowuser
        POSTGRES_PASSWORD_TEST: s2lowpassword
        POSTGRES_DB_TEST: s2lowdb
        POSTGRES_DATABASE_TEST: s2lowdb
        POSTGRES_HOST_TEST: postgres
        POSTGRES_HOST: postgres
        S2LOW_WEBSITE: "localhost"
    before_script:
        - apt-get -qq update && apt-get -yqq install openssh-client lftp
        - mkdir -p ~/.ssh
        - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    script:
        - cd /var/www/ && tar cvzf /tmp/${TARBALL_NAME} s2low
        - lftp -p 2222 -u "s2low","${RESSOURCE_LIBRICIEL_FTP_PASSWD}"  "sftp://ressources.libriciel.fr/s2low" -e "put /tmp/${TARBALL_NAME}; bye"
        - curl -i -X POST -d "$PAYLOAD" $MATTERMOST_WEBHOOK
