include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  # FIXME: disabled because the qlty code-quality job uses too much memory, gets OOM-killed
  # by the runner and blocks the other jobs of the pipeline.
  #  - component: $LIBRICIEL_CATALOG_PATH/qlty/code-quality@~latest
  #    inputs:
  #      mode: "changed"
  - component: $LIBRICIEL_CATALOG_PATH/project-standards/check-libriciel-standards@3.1.0
  - component: $LIBRICIEL_CATALOG_PATH/renovate-runner/runner@1.6.1
  - component: $LIBRICIEL_CATALOG_PATH/software-release/publish-compose@3.2.1
  - component: $LIBRICIEL_CATALOG_PATH/sbom-manager/build@1.4.0
    inputs:
      compose_file: "compose.yaml"
      version_placeholder: "canary"

stages:
    - .pre
    - build
    - static-analysis
    - test
    - quality
    - deploy
    - staging
    - production

variables:
    CONTAINER_IMAGE_BASE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}"
    CONTAINER_IMAGE_APP: "${CONTAINER_IMAGE_BASE}-app"
    CONTAINER_IMAGE_WEB: "${CONTAINER_IMAGE_BASE}-web"
    APK_PINNED_PACKAGES: ""
    DOCKER_BUILD_OPTS: ""
    DATABASE_USER: s2low
    DATABASE_PASSWORD: s2low
    DATABASE_NAME: s2low
    DATABASE_HOST: postgres
    POSTGRES_USER: s2low
    POSTGRES_PASSWORD: s2low
    POSTGRES_DB: s2low
    DATABASE_USER_TEST: s2low
    DATABASE_PASSWORD_TEST: s2low
    DATABASE_NAME_TEST: s2low
    DATABASE_HOST_TEST: postgres
    DATABASE_URL: "postgresql://s2low:s2low@postgres:5432/s2low?serverVersion=14&charset=utf8"
    APP_HOST: localhost
    MAILSEC_HOST: 127.0.0.1
    WEBMASTER: 'https://www.adullact.org'
    HELIOS_SENDING_DESTINATION: '/entree/'


build-app:
  stage: build
  tags:
    - docker-build
#  variables:
#    DOCKER_BUILDKIT: 1
  script:
    - docker build ${DOCKER_BUILD_OPTS} --build-arg APK_PINNED_PACKAGES="${APK_PINNED_PACKAGES}" --target dev --pull -t ${CONTAINER_IMAGE_APP} -f docker/app/Dockerfile .
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker push ${CONTAINER_IMAGE_APP}

build-web:
  stage: build
  tags:
    - docker-build
#  variables:
#    DOCKER_BUILDKIT: 1
  script:
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker build ${DOCKER_BUILD_OPTS} --pull -t ${CONTAINER_IMAGE_WEB} -f docker/web/Dockerfile .
    - docker push ${CONTAINER_IMAGE_WEB}

lint:
  stage: static-analysis
  image : "$CONTAINER_IMAGE_APP"
  variables:
    DONT_RETRIEVE_VALIDCA: "true"
    DONT_INIT_DATABASE: "true"
  script:
    - cd /app
    - vendor/bin/phpcs

phpstan:
  stage: static-analysis
  image : "$CONTAINER_IMAGE_APP"
  variables:
    DONT_INIT_DATABASE: "true"
    DONT_RETRIEVE_VALIDCA: "true"
  script:
    - cd /app
    - vendor/bin/phpstan

unit_test:
    stage: test
    image : "$CONTAINER_IMAGE_APP"
    variables:
        COMPOSER_PROCESS_TIMEOUT: 9000
        XDEBUG_MODE: coverage
        APP_ENV: test
    services:
      - name: registry.libriciel.fr/public/outils/postgres:14.5@sha256:a0c6930be56082d2b6f747630ab6e5799c566c7ec45c49033e8b647ca2e50bee
        alias: postgres
        command: [ "postgres","-c", "max_connections=200" ]
      - name: registry.libriciel.fr/public/signature/pdf-stamp:2.7.15@sha256:e111a2b77e67415270b0e9c149d4c7b5460aa464d379b390e15d27292576e261
        alias: pdf-stamp
    script:
        - cd /app
        - composer test-cover
        - cp -rf coverage $CI_PROJECT_DIR
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    artifacts:
      paths:
        - coverage
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage/cobertura.xml
        junit: coverage/logfile.xml
      expire_in: 1h

quality:
  stage: quality
  only:
    - master
  image:
    name: hubdocker.libriciel.fr/sonarsource/sonar-scanner-cli:12.2@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    entrypoint: [ "/bin/sh", "-c" ]
  script:
    - sonar-scanner -Dsonar.token=$SONAR_LOGIN -Dsonar.host.url=$SONAR_HOST_URL


.security_scan_base:
  stage: test
  image:
    name: hubdocker.libriciel.fr/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  services:
    - docker:dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
  script:
    - apk add --no-cache curl docker-cli
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - trivy image --no-progress  --output scanning-report.txt $CONTAINER_IMAGE
    - trivy image --exit-code 1 --no-progress --severity HIGH,CRITICAL $CONTAINER_IMAGE
  artifacts:
    reports:
      container_scanning: scanning-report.txt
    expire_in: 1 week

security_scan_app:
  allow_failure: true
  extends: .security_scan_base
  variables:
    CONTAINER_IMAGE: $CONTAINER_IMAGE_APP

security_scan_web:
  allow_failure: true
  extends: .security_scan_base
  variables:
    CONTAINER_IMAGE: $CONTAINER_IMAGE_WEB

publish-container-to-registry:
  stage: deploy
  tags:
    - docker-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG != null
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      variables:
        IMAGE_VERSION: 'canary'
  variables:
    IMAGE_VERSION: $CI_COMMIT_REF_NAME
    APP_IMAGE: ${REGISTRY_CONTAINER_HOST}${REGISTRY_CONTAINER_PATH}-app:$IMAGE_VERSION
    WEB_IMAGE: ${REGISTRY_CONTAINER_HOST}${REGISTRY_CONTAINER_PATH}-web:$IMAGE_VERSION
  before_script:
    - date=$(date)
    - sed -i "s/%CI_BUILD_ID%/${CI_PIPELINE_ID}/" ./manifest.txt
    - sed -i "s/%BUILD_DATE%/$date/" ./manifest.txt
    - sed -i "s/%VERSION%/${CI_COMMIT_REF_NAME}/" ./manifest.txt
  script:
    - docker login -u "$REGISTRY_CONTAINER_USER" -p "$REGISTRY_CONTAINER_PASSWORD" "$REGISTRY_CONTAINER_HOST"
    - docker build ${DOCKER_BUILD_OPTS} --build-arg APK_PINNED_PACKAGES="${APK_PINNED_PACKAGES}" --pull -t ${APP_IMAGE} -f docker/app/Dockerfile .
    - docker push ${APP_IMAGE}
    - docker build ${DOCKER_BUILD_OPTS} --pull -t ${WEB_IMAGE} -f docker/web/Dockerfile .
    - docker push ${WEB_IMAGE}

generate-sbom-compose:
  needs: [ "publish-container-to-registry"]

package-sbom-compose:
  needs: [ "generate-sbom-compose" ]

publish-compose:
  needs: [ "publish-container-to-registry", "package-sbom-compose" ]
  variables:
    INPUT_DIRECTORY: ./
    COMPOSE_FILE_NAME: compose.yaml
  before_script:
    - mv docker-resources docker-resources-orig
    - mkdir docker-resources
    - mv docker-resources-orig/Makefile docker-resources/
    - sed -i "s/canary$/${CI_COMMIT_REF_NAME}/" ./compose.yaml

deploy_app:
  stage: staging
  only:
    - master
  variables:
    PAYLOAD: "payload={\"text\": \"[s2low-5-0.dev.libriciel.net](https://s2low-5-0.dev.libriciel.net) a été mis à jour - [build $CI_PIPELINE_ID]($CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID)\"}"
  script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - scp ./compose.yaml s2low@s2low-5-0.dev.libriciel.net:/opt/s2low/
    - scp ./compose.dev.yaml s2low@s2low-5-0.dev.libriciel.net:/opt/s2low/compose.override.yaml
    - echo "$DEV_ENV_FILE" > /tmp/.env
    - scp /tmp/.env s2low@s2low-5-0.dev.libriciel.net:/opt/s2low/
    - ssh -tt s2low@s2low-5-0.dev.libriciel.net "cd /opt/s2low/ && docker compose pull && docker compose up -d"
    - curl -i -X POST -d "$PAYLOAD" $MATTERMOST_WEBHOOK

container_scanning:
  variables:
    CS_IMAGE: $CONTAINER_IMAGE_APP
