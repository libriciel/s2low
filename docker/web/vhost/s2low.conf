<VirtualHost *:80>
    ServerAdmin root@localhost
    ServerName ${APP_HOST}
    DocumentRoot /app/public/
    DirectoryIndex index.php index.html

    ErrorLog /data/log/s2low-error.log
    CustomLog /data/log/s2low-access combined

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    <Directory /app/public>
        Options +FollowSymLinks -Indexes
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge /acme-challenge/.well-known/acme-challenge
    <Directory /acme-challenge/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin root@localhost
    ServerName ${APP_HOST}
    DocumentRoot /app/public.ssl/

    SSLEngine on
    SSLVerifyClient require
    SSLVerifyDepth 5
    SSLCertificateFile /data/certificates/app/fullchain.pem
    SSLCertificateKeyFile /data/certificates/app/privkey.pem
    SSLCACertificatePath /data/certificates/_validca/validca
    SSLCARevocationPath /data/certificates/_validca/validca
    SSLCARevocationCheck chain

    LogLevel ${LOG_LEVEL}
    ErrorLog /data/log/s2low-error-ssl.log
    CustomLog /data/log/s2low-access-ssl.log combined

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

	<Directory /app/public.ssl>
        RewriteEngine On
        RewriteCond %{REQUEST_URI}::$1 ^(/.+)/(.*)::\2$
        RewriteRule ^(.*) - [E=BASE:%1]

        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteRule ^index\.php(?:/(.*)|$) %{ENV:BASE}/$1 [R=301,L]

        RewriteRule ^index\.php - [L]

        RewriteCond %{REQUEST_FILENAME} -f
        RewriteCond %{REQUEST_FILENAME} !^.+\.php$
        RewriteRule ^ - [L]

        RewriteRule ^ %{ENV:BASE}/index.php [L]

        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted

        LimitRequestBody 200486000
        SSLRenegBufferSize 200486000
	</Directory>

</VirtualHost>