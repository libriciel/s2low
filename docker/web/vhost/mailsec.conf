<VirtualHost *:80>
    ServerAdmin root@localhost
    ServerName ${MAILSEC_HOST}
    DocumentRoot /app/public/
    DirectoryIndex index.php index.html

    ErrorLog /data/log/s2low-error.log
    CustomLog /data/log/s2low-access combined

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    <Directory /app/public>
        Options +FollowSymLinks -Indexes
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge /acme-challenge/.well-known/acme-challenge
    <Directory /acme-challenge/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteRule ^/?/?modules/mail(.*)$ https://${MAILSEC_HOST}:${HTTPS_PORT}/modules/mail$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin root@localhost
    ServerName ${MAILSEC_HOST}
    DocumentRoot /app/public.ssl/

    SSLEngine on
    SSLCertificateFile /data/certificates/mailsec/fullchain.pem
    SSLCertificateKeyFile /data/certificates/mailsec/privkey.pem

    LogLevel ${LOG_LEVEL}
    ErrorLog /data/log/mailsec-error-ssl.log
    CustomLog /data/log/mailsec-access-ssl.log combined

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    <Directory /app/public>
        Options +FollowSymLinks -Indexes
    </Directory>

</VirtualHost>