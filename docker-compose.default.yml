version: '2.0'

services:
    web:
        image: s2low:docker
        links:
            - db
            - clamav
            - ftp
            - simulateur
            - pades-valid
            - pdf-stamp
            - mail
        environment:
            PUBLISH_SIMULATEUR: "true"
        ports:
          - 80:80
          - 443:443
    db:
        image: gitlab.libriciel.fr:4567/docker/postgres:9.5
        environment:
            - POSTGRES_USER=s2lowuser
            - POSTGRES_PASSWORD=s2lowpassword
            - POSTGRES_DB=s2lowdb

    clamav:
        image: mkodockx/docker-clamav

    pades-valid:
        image: gitlab.libriciel.fr:4567/outils/pades-valid:1.1.1

    pdf-stamp:
        image: gitlab.libriciel.fr:4567/outils/pdf-stamp:1.3.0

    ftp:
        image: mcreations/ftp
        environment:
            FTP_USER: helios
            FTP_PASS: helios
            PASV_MIN_PORT: 65000
            PASV_MAX_PORT: 65004
        volumes:
          - /tmp/simulateur:/data/ftpuser/

    mail:
        build:
            context: ./docker-resources/
            dockerfile: Dockerfile-mail
        environment:
            - MAILNAME=mail.docker.libriciel.fr
            - MAIL_ADDRESS=tedetis@s2low.docker.libriciel.fr
            - MAIL_PASS=tedetis

    simulateur:
        image: gitlab.libriciel.fr:4567/s2low/simulateur-helios:master
        links:
             - ftp:ftp
             - mail:mail
        environment:
            MAIL_HOST: mail
            MAIL_PORT: 25
            MAIL_FROM: dgcl@s2low.docker.libriciel.fr
        volumes:
            - /tmp/simulateur/:/var/www/simulateur-helios/workspace
