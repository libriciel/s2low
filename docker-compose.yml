version: '3.5'

services:
    web:
        networks:
          - openstack
        environment:
            EMAIL_ADMIN_TECHNIQUE: ${EMAIL_ADMIN_TECHNIQUE}
            S2LOW_WEBSITE: ${S2LOW_WEBSITE}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_HOST: ${POSTGRES_HOST}
            HELIOS_FTP_SERVER: ${HELIOS_FTP_SERVER}
            HELIOS_FTP_PORT: ${HELIOS_FTP_PORT}
            HELIOS_FTP_PASSIVE_MODE: ${HELIOS_FTP_PASSIVE_MODE}
            HELIOS_SENDING_MODE_DEMO: ${HELIOS_SENDING_MODE_DEMO}
            HELIOS_FTP_PST_MODE: ${HELIOS_FTP_PST_MODE}
            HELIOS_FTP_P_APPLI: ${HELIOS_FTP_P_APPLI}
            HELIOS_FTP_LOGIN: ${HELIOS_FTP_LOGIN}
            HELIOS_FTP_PASSWORD: ${HELIOS_FTP_PASSWORD}
            HELIOS_SENDING_DESTINATION: ${HELIOS_SENDING_DESTINATION}
            HELIOS_FTP_RESPONSE_SERVER_PATH: ${HELIOS_FTP_RESPONSE_SERVER_PATH}
            HELIOS_FTP_RESPONSE_TMP_LOCAL_PATH: ${HELIOS_FTP_RESPONSE_TMP_LOCAL_PATH}
            SMTP_SERVER: ${SMTP_SERVER}
            SMTP_PORT: ${SMTP_PORT}
            PUBLISH_SIMULATEUR: ${PUBLISH_SIMULATEUR}
            ACTES_OPENSTACK_AUTHENTICATION_URL_V3: ${ACTES_OPENSTACK_AUTHENTICATION_URL_V3}
            ACTES_OPENSTACK_USERNAME: ${ACTES_OPENSTACK_USERNAME}
            ACTES_OPENSTACK_PASSWORD: ${ACTES_OPENSTACK_PASSWORD}
            ACTES_OPENSTACK_TENANT: ${ACTES_OPENSTACK_TENANT}
            ACTES_OPENSTACK_REGION: ${ACTES_OPENSTACK_REGION}
            ACTES_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${ACTES_OPENSTACK_SWIFT_CONTAINER_PREFIX}

            HELIOS_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_OPENSTACK_AUTHENTICATION_URL_V3}
            HELIOS_OPENSTACK_USERNAME: ${HELIOS_OPENSTACK_USERNAME}
            HELIOS_OPENSTACK_PASSWORD: ${HELIOS_OPENSTACK_PASSWORD}
            HELIOS_OPENSTACK_TENANT: ${HELIOS_OPENSTACK_TENANT}
            HELIOS_OPENSTACK_REGION: ${HELIOS_OPENSTACK_REGION}
            HELIOS_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_OPENSTACK_SWIFT_CONTAINER_PREFIX}

            HELIOS_ACQUIT_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_ACQUIT_OPENSTACK_AUTHENTICATION_URL_V3}
            HELIOS_ACQUIT_OPENSTACK_USERNAME: ${HELIOS_ACQUIT_OPENSTACK_USERNAME}
            HELIOS_ACQUIT_OPENSTACK_PASSWORD: ${HELIOS_ACQUIT_OPENSTACK_PASSWORD}
            HELIOS_ACQUIT_OPENSTACK_TENANT: ${HELIOS_ACQUIT_OPENSTACK_TENANT}
            HELIOS_ACQUIT_OPENSTACK_REGION: ${HELIOS_ACQUIT_OPENSTACK_REGION}
            HELIOS_ACQUIT_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_ACQUIT_OPENSTACK_SWIFT_CONTAINER_PREFIX}

            HELIOS_RETOUR_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_RETOUR_OPENSTACK_AUTHENTICATION_URL_V3}
            HELIOS_RETOUR_OPENSTACK_USERNAME: ${HELIOS_RETOUR_OPENSTACK_USERNAME}
            HELIOS_RETOUR_OPENSTACK_PASSWORD: ${HELIOS_RETOUR_OPENSTACK_PASSWORD}
            HELIOS_RETOUR_OPENSTACK_TENANT: ${HELIOS_RETOUR_OPENSTACK_TENANT}
            HELIOS_RETOUR_OPENSTACK_REGION: ${HELIOS_RETOUR_OPENSTACK_REGION}
            HELIOS_RETOUR_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_RETOUR_OPENSTACK_SWIFT_CONTAINER_PREFIX}

            MAILSEC_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_ACQUIT_OPENSTACK_AUTHENTICATION_URL_V3}
            MAILSEC_OPENSTACK_USERNAME: ${HELIOS_ACQUIT_OPENSTACK_USERNAME}
            MAILSEC_OPENSTACK_PASSWORD: ${HELIOS_ACQUIT_OPENSTACK_PASSWORD}
            MAILSEC_OPENSTACK_TENANT: ${HELIOS_ACQUIT_OPENSTACK_TENANT}
            MAILSEC_OPENSTACK_REGION: ${HELIOS_ACQUIT_OPENSTACK_REGION}
            MAILSEC_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_ACQUIT_OPENSTACK_SWIFT_CONTAINER_PREFIX}

            ACTES_IMAP_LOGIN: ${ACTES_IMAP_LOGIN}
            ACTES_IMAP_PASSWORD: ${ACTES_IMAP_PASSWORD}
            IMAP_LOGIN: ${IMAP_LOGIN}
            IMAP_PASS: ${IMAP_PASS}
            MAILNAME: ${MAILNAME}

            USE_LEGACY_BORDEREAU_MODEL: ${USE_LEGACY_BORDEREAU_MODEL-false}
        volumes:
            - ${WORKSPACE_VOLUME}:/data/tdt-workspace
            - ${SERVER_SSL_CERTIFICAT}:/etc/apache2/ssl/
            - ${TIMESTAMP_CERTIFICAT_PATH}:/etc/s2low/ssl/
            - ${LOG_PATH}:/data/log/

    db:
        image: gitlab.libriciel.fr:4567/docker/postgres:9.6.5
        networks:
          - services
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ${POSTGRESQL_DATADIR}:/var/lib/postgresql/data

    openstack:
        image: serverascode/swift-onlyone
        networks:
          - openstack
        volumes:
            - ${VOL_OPENSTACK}:/srv
        ports:
            - ${BEANSTALKD_PORT:-10003}:8080

    simulateur:
        image: gitlab.libriciel.fr:4567/libriciel/pole-plate-formes/s2low/projets-annexes/simulateur-helios:1.1.1
        networks:
          - dgfip
          - dgcl
          - services
        depends_on:
          - ftp
        ports:
            - ${SIMULATEUR_SITE_PORT}:80
        volumes:
            - ${SIMULATEUR_WORKSPACE_DIRECTORY}:/var/www/simulateur-helios/workspace
        environment:
            MAIL_HOST: mail
            MAIL_PORT: 25
            MAIL_FROM: "dgcl@${MAILNAME}"

    ftp:
        image: mcreations/ftp
        networks:
          - dgfip
        environment:
            FTP_USER: ${HELIOS_FTP_LOGIN}
            FTP_PASS: ${HELIOS_FTP_PASSWORD}
            PASV_MIN_PORT: ${PASV_MIN_PORT}
            PASV_MAX_PORT: ${PASV_MAX_PORT}
        volumes:
          - ${SIMULATEUR_WORKSPACE_DIRECTORY}:/data/${HELIOS_FTP_LOGIN}/
        ports:
          - "${FTP_PORT}:21"
          - "${PASV_MIN_PORT}-${PASV_MAX_PORT}:${PASV_MIN_PORT}-${PASV_MAX_PORT}"

    mail:
        image: gitlab.libriciel.fr:4567/docker/docker-imap-devel:1.0
        networks:
          - services
        environment:
            - MAILNAME=${MAILNAME}
            - MAIL_ADDRESS=${ACTES_IMAP_LOGIN}
            - MAIL_PASS=${ACTES_IMAP_PASSWORD}

    mailsec:
        image: gitlab.libriciel.fr:4567/docker/mail-master:1.0
        networks:
          - services
        environment:
            - DOMAINS=${MAILNAME}
            - POSTFIX_HOSTNAME=s2low-mailsec.libriciel.fr
            - MAILS=${IMAP_LOGIN}
            - NOPASS=true
    clamav:
        image: mkodockx/docker-clamav
        networks:
          - services

    pades-valid:
        image: gitlab.libriciel.fr:4567/outils/pades-valid:1.4.4
        networks:
          - services

    pdf-stamp:
        image: gitlab.libriciel.fr:4567/outils/pdf-stamp:2.4.5
        networks:
          - services

    redis:
        image: redis:3.2
        restart: always
        volumes:
            - ${REDIS_VOLUME}:/data
        command: redis-server --appendonly yes
        networks:
            - services

    beanstalkd:
        image: schickling/beanstalkd
        restart: always
        networks:
            - services
networks:
  dgcl:
  dgfip:
  services:
  openstack:
