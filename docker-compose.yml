version: '2.0'

services:
    web:
        links:
            - db
            - clamav
        environment:
            S2LOW_WEBSITE: ${S2LOW_WEBSITE}
            S2LOW_WEBSITE_SSL: ${S2LOW_WEBSITE_SSL}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_HOST: ${POSTGRES_HOST}
            HELIOS_FTP_SERVER: ${HELIOS_FTP_SERVER}
            HELIOS_FTP_PORT: ${HELIOS_FTP_PORT}
            HELIOS_FTP_PASSIVE_MODE: ${HELIOS_FTP_PASSIVE_MODE}
            HELIOS_SENDING_DESTINATION: ${HELIOS_SENDING_DESTINATION}
            HELIOS_FTP_RESPONSE_SERVER_PATH: ${HELIOS_FTP_RESPONSE_SERVER_PATH}
            HELIOS_FTP_LOGIN: ${HELIOS_FTP_LOGIN}
            HELIOS_FTP_PASSWORD: ${HELIOS_FTP_PASSWORD}
            SMTP_SERVER: ${SMTP_SERVER}
            SMTP_PORT: ${SMTP_PORT}
            LIBERSIGN_INSTALLER: ${LIBERSIGN_INSTALLER}
            PUBLISH_SIMULATEUR: ${PUBLISH_SIMULATEUR}
            OPENSTACK_AUTHENTICATION_URL_V2: ${OPENSTACK_AUTHENTICATION_URL_V2}
            OPENSTACK_USERNAME: ${OPENSTACK_USERNAME}
            OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD}
            OPENSTACK_TENANT: ${OPENSTACK_TENANT}
            OPENSTACK_REGION: ${OPENSTACK_REGION}
            OPENSTACK_SWIFT_CONTAINER_PREFIX: ${OPENSTACK_SWIFT_CONTAINER_PREFIX}
            IMAP_SERVER: ${IMAP_SERVER}
            IMAP_LOGIN: ${IMAP_LOGIN}
            IMAP_PASS: ${IMAP_PASS}
            PADES_VALID_URL: ${PADES_VALID_URL}
            PDF_STAMP_URL: ${PDF_STAMP_URL}
            EMAIL_ADMIN_TECHNIQUE: ${EMAIL_ADMIN_TECHNIQUE}

        volumes:
            - ${WORKSPACE_VOLUME}:/data/tdt-workspace
            - ${PHP_SESSION}:/var/lib/php/session
            - ${SERVER_SSL_CERTIFICAT}:/etc/apache2/ssl/
    db:
        build:
            context: ./docker-resources/
            dockerfile: Dockerfile-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ${POSTGRESQL_DATADIR}:/var/lib/postgresql/data

    openstack:
        image: serverascode/swift-onlyone
        volumes:
            - /Users/eric/data_docker/s2low/openstack:/srv
        ports:
            - 10003:8080

    clamav:
        image: mkodockx/docker-clamav

    pades-valid:
        image: gitlab.libriciel.fr:4567/outils/pades-valid

    pdf-stamp:
        image: gitlab.libriciel.fr:4567/outils/pdf-stamp


