name: s2low

services:
  app:
    image: registry.libriciel.fr/public/plateforme/s2low-app:canary
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "${UID:-10001}:${GID:-10001}"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_SECRET: ${APP_SECRET:?}
      APP_HOST: ${APP_HOST:?}
      MAILSEC_HOST: ${MAILSEC_HOST:?}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      EMAIL_ADMIN_TECHNIQUE: ${EMAIL_ADMIN_TECHNIQUE:-noreply@libriciel.invalid}
      OPERATEUR_DE_TELETRANSMISSION: ${OPERATEUR_DE_TELETRANSMISSION:-LIBRICIEL}
      DATABASE_USER: ${DATABASE_USER:-s2low}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-?}
      DATABASE_NAME: ${DATABASE_NAME:-s2low}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      CONVERT_API_LOGINS_FROM_ISO: ${CONVERT_API_LOGINS_FROM_ISO:-false}
      HELIOS_FTP_P_APPLI: ${HELIOS_FTP_P_APPLI:-GHELPES2}
      HELIOS_NB_FILES_ENVOI: ${HELIOS_NB_FILES_ENVOI:-1}
      HELIOS_SENDING_DESTINATION: ${HELIOS_SENDING_DESTINATION:-/entree/}
      HELIOS_USE_PASSTRANS_AS_DEFAULT: ${HELIOS_USE_PASSTRANS_AS_DEFAULT:-false}
      HELIOS_FTP_SERVER: ${HELIOS_FTP_SERVER:-ftp}
      HELIOS_FTP_PORT: ${HELIOS_FTP_PORT:-21}
      HELIOS_FTP_PASSIVE_MODE: ${HELIOS_FTP_PASSIVE_MODE:-true}
      HELIOS_FTP_CONNECTION_MODE: ${HELIOS_FTP_CONNECTION_MODE:-SIMULATEUR}
      HELIOS_FTP_LOGIN: ${HELIOS_FTP_LOGIN:-helios}
      HELIOS_FTP_PASSWORD: ${HELIOS_FTP_PASSWORD:-helios}
      HELIOS_FTP_RESPONSE_SERVER_PATH: ${HELIOS_FTP_RESPONSE_SERVER_PATH:-/sortie/}
      HELIOS_PASSTRANS_RECEPTION_ENABLE: ${HELIOS_PASSTRANS_RECEPTION_ENABLE:-false}
      HELIOS_NB_FILES_ENVOI_PASSTRANS: ${HELIOS_NB_FILES_ENVOI_PASSTRANS:-0}
      HELIOS_PASSTRANS_SERVER: ${HELIOS_PASSTRANS_SERVER:-ftp_passtrans}
      HELIOS_PASSTRANS_PORT: ${HELIOS_PASSTRANS_PORT:-21}
      HELIOS_PASSTRANS_PASSIVE_MODE: ${HELIOS_PASSTRANS_PASSIVE_MODE:-true}
      HELIOS_PASSTRANS_CONNECTION_MODE: ${HELIOS_PASSTRANS_CONNECTION_MODE:-SIMULATEUR}
      HELIOS_PASSTRANS_LOGIN: ${HELIOS_PASSTRANS_LOGIN:-helios-passtrans}
      HELIOS_PASSTRANS_PASSWORD: ${HELIOS_PASSTRANS_PASSWORD:-helios-passtrans}
      HELIOS_PASSTRANS_SENDING_DESTINATION: ${HELIOS_PASSTRANS_SENDING_DESTINATION:-/entree/}
      HELIOS_PASSTRANS_RESPONSE_SERVER_PATH: ${HELIOS_PASSTRANS_RESPONSE_SERVER_PATH:-/sortie/}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailsec:25?verify_peer=0}
      TDT_FROM_EMAIL: ${TDT_FROM_EMAIL:-Tiers de télétransmission <s2low@s2low.docker.libriciel.fr>}
      PUBLISH_SIMULATEUR: ${PUBLISH_SIMULATEUR:-true}
      MAIL_MESSAGE: ${MAIL_MESSAGE:-}
      MAIL_TEXT: ${MAIL_TEXT:-}
      ONLY_USE_VALIDCARGS: ${ONLY_USE_VALIDCARGS:-false}
      PDF_STAMP_URL: ${PDF_STAMP_URL:-http://pdf-stamp:8080/pdf-stamp/}

      OPENSTACK_ENABLE: ${OPENSTACK_ENABLE:-false}
      ACTES_OPENSTACK_AUTHENTICATION_URL_V3: ${ACTES_OPENSTACK_AUTHENTICATION_URL_V3:-}
      ACTES_OPENSTACK_USERNAME: ${ACTES_OPENSTACK_USERNAME:-}
      ACTES_OPENSTACK_PASSWORD: ${ACTES_OPENSTACK_PASSWORD:-}
      ACTES_OPENSTACK_TENANT: ${ACTES_OPENSTACK_TENANT:-}
      ACTES_OPENSTACK_REGION: ${ACTES_OPENSTACK_REGION:-}
      ACTES_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${ACTES_OPENSTACK_SWIFT_CONTAINER_PREFIX:-}

      HELIOS_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_OPENSTACK_AUTHENTICATION_URL_V3:-}
      HELIOS_OPENSTACK_USERNAME: ${HELIOS_OPENSTACK_USERNAME:-}
      HELIOS_OPENSTACK_PASSWORD: ${HELIOS_OPENSTACK_PASSWORD:-}
      HELIOS_OPENSTACK_TENANT: ${HELIOS_OPENSTACK_TENANT:-}
      HELIOS_OPENSTACK_REGION: ${HELIOS_OPENSTACK_REGION:-}
      HELIOS_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_OPENSTACK_SWIFT_CONTAINER_PREFIX:-}

      HELIOS_ACQUIT_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_ACQUIT_OPENSTACK_AUTHENTICATION_URL_V3:-}
      HELIOS_ACQUIT_OPENSTACK_USERNAME: ${HELIOS_ACQUIT_OPENSTACK_USERNAME:-}
      HELIOS_ACQUIT_OPENSTACK_PASSWORD: ${HELIOS_ACQUIT_OPENSTACK_PASSWORD:-}
      HELIOS_ACQUIT_OPENSTACK_TENANT: ${HELIOS_ACQUIT_OPENSTACK_TENANT:-}
      HELIOS_ACQUIT_OPENSTACK_REGION: ${HELIOS_ACQUIT_OPENSTACK_REGION:-}
      HELIOS_ACQUIT_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_ACQUIT_OPENSTACK_SWIFT_CONTAINER_PREFIX:-}

      HELIOS_RETOUR_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_RETOUR_OPENSTACK_AUTHENTICATION_URL_V3:-}
      HELIOS_RETOUR_OPENSTACK_USERNAME: ${HELIOS_RETOUR_OPENSTACK_USERNAME:-}
      HELIOS_RETOUR_OPENSTACK_PASSWORD: ${HELIOS_RETOUR_OPENSTACK_PASSWORD:-}
      HELIOS_RETOUR_OPENSTACK_TENANT: ${HELIOS_RETOUR_OPENSTACK_TENANT:-}
      HELIOS_RETOUR_OPENSTACK_REGION: ${HELIOS_RETOUR_OPENSTACK_REGION:-}
      HELIOS_RETOUR_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_RETOUR_OPENSTACK_SWIFT_CONTAINER_PREFIX:-}

      MAILSEC_OPENSTACK_AUTHENTICATION_URL_V3: ${HELIOS_ACQUIT_OPENSTACK_AUTHENTICATION_URL_V3:-}
      MAILSEC_OPENSTACK_USERNAME: ${HELIOS_ACQUIT_OPENSTACK_USERNAME:-}
      MAILSEC_OPENSTACK_PASSWORD: ${HELIOS_ACQUIT_OPENSTACK_PASSWORD:-}
      MAILSEC_OPENSTACK_TENANT: ${HELIOS_ACQUIT_OPENSTACK_TENANT:-}
      MAILSEC_OPENSTACK_REGION: ${HELIOS_ACQUIT_OPENSTACK_REGION:-}
      MAILSEC_OPENSTACK_SWIFT_CONTAINER_PREFIX: ${HELIOS_ACQUIT_OPENSTACK_SWIFT_CONTAINER_PREFIX:-}

      ACTES_TDT_MAIL_ADDRESS: ${ACTES_TDT_MAIL_ADDRESS:-mail@s2low.docker.libriciel.net}
      ACTES_IMAP_LOGIN: ${ACTES_IMAP_LOGIN:-mail@s2low.docker.libriciel.net}
      ACTES_IMAP_PASSWORD: ${ACTES_IMAP_PASSWORD:-password}
      ACTES_IMAP_HOST: ${ACTES_IMAP_HOST:-mail}
      ACTES_IMAP_PORT: ${ACTES_IMAP_PORT:-143}
      ACTES_IMAP_OPTIONS: ${ACTES_IMAP_OPTIONS:-/imap/notls/novalidate-cert}

      ACTES_MINISTERE_URL: ${ACTES_MINISTERE_URL:-http://simulateur/Simulateur/actesPost}
      ACTES_MINISTERE_AUTHENTICATION: ${ACTES_MINISTERE_AUTHENTICATION:-NONE}
      ACTES_MINISTERE_LOGIN: ${ACTES_MINISTERE_LOGIN:-}
      ACTES_MINISTERE_PASSWORD: ${ACTES_MINISTERE_PASSWORD:-}
      ACTES_MINISTERE_CERTIFICATE: ${ACTES_MINISTERE_CERTIFICATE:-}
      ACTES_MINISTERE_CERTIFICATE_KEY: ${ACTES_MINISTERE_CERTIFICATE_KEY:-}
      ACTES_MINISTERE_CERTIFICATE_KEY_PASS: ${ACTES_MINISTERE_CERTIFICATE_KEY_PASS:-}
      ACTES_MINISTERE_SERVER_CERTIFICATE_PATH: ${ACTES_MINISTERE_SERVER_CERTIFICATE_PATH:-}
      ACTES_MINISTERE_ADAPT_PROTOCOL: ${ACTES_MINISTERE_ADAPT_PROTOCOL:-false}
      ACTES_MINISTERE_USE_LEGACY_PROTOCOL: ${ACTES_MINISTERE_USE_LEGACY_PROTOCOL:-true}

      ACTES_APPLI_NAME: ${ACTES_APPLI_NAME:-TACT}
      ACTES_APPLI_TRIGRAMME: ${ACTES_APPLI_TRIGRAMME:-abc}
      ACTES_APPLI_QUADRIGRAMME: ${ACTES_APPLI_QUADRIGRAMME:-TACT}
      ACTES_MAIL_BACKUP: ${ACTES_MAIL_BACKUP:-}

      ACTES_COMMON_BROADCAST_EMAILS: ${ACTES_COMMON_BROADCAST_EMAILS:-}

      USE_LEGACY_BORDEREAU_MODEL: ${USE_LEGACY_BORDEREAU_MODEL-false}
      USE_LEGACY_SECURE_MAIL_FIELDS: ${USE_LEGACY_SECURE_MAIL_FIELDS-false}
      MAIL_TEDETIS_FROM: ${MAIL_TEDETIS_FROM-}
      MAIL_SECURE_DESCRIPTION: ${MAIL_SECURE_DESCRIPTION-}

      ACTES_ALWAYS_CAN_VALIDATE: ${ACTES_ALWAYS_CAN_VALIDATE:-false}

      USE_PROD_NOTIFICATIONS: ${USE_PROD_NOTIFICATIONS:-true}

      HELIOS_PURGE_ENABLE: ${HELIOS_PURGE_ENABLE:-false}
      HELIOS_RETENTION_FICHIERS_NB_JOURS: ${HELIOS_RETENTION_FICHIERS_NB_JOURS:-3650000}

      CLOUD_PROVIDER_ENDPOINT: ${CLOUD_PROVIDER_ENDPOINT:-}
      CLOUD_PROVIDER_KEY: ${CLOUD_PROVIDER_KEY:-}
      CLOUD_PROVIDER_SECRET: ${CLOUD_PROVIDER_SECRET:-}
      CLOUD_BUCKET_ACTE_ENVELOPPE: ${CLOUD_BUCKET_ACTE_ENVELOPPE:-}
      CLOUD_BUCKET_PES_ALLER: ${CLOUD_BUCKET_PES_ALLER:-}
      CLOUD_BUCKET_PES_ACQUIT: ${CLOUD_BUCKET_PES_ACQUIT:-}
      CLOUD_BUCKET_PES_RETOUR: ${CLOUD_BUCKET_PES_RETOUR:-}
      CLOUD_BUCKET_MAIL_SEC: ${CLOUD_BUCKET_MAIL_SEC:-}
    tmpfs:
      - /data/config:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev,size=5M
      - /data/run:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev
      - /data/lock:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev
      - /data/html_purifier:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev
      - /var/run:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev
      - /app/var:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev
      - /app/ext/standalone:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev,size=500M
      - /tmp:mode=770,uid=${UID:-10001},gid=${GID:-10001},rw,noexec,nosuid,nodev,size=8G
    volumes:
      - ${WORKSPACE_VOLUME:-app_workspace}:/data/tdt-workspace/:rw,noexec,nosuid,nodev
      - ${APP_LOGS_PATH:-app_logs_datadir}:/data/log/:rw,noexec,nosuid,nodev
      - ${APP_CERTIFICATES_PATH:-app_certificates}:/data/certificates/:rw,noexec,nosuid,nodev

  web:
    image: registry.libriciel.fr/public/plateforme/s2low-web:canary
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    user: "www-data:www-data"
    environment:
      APP_HOST: ${APP_HOST:?}
      MAILSEC_HOST: ${MAILSEC_HOST:?}
      ACME_APP_ENABLED: ${ACME_APP_ENABLED:-false}
      ACME_APP_SERVER: ${ACME_APP_SERVER:-}
      ACME_APP_EMAIL: ${ACME_APP_EMAIL:-}
      ACME_APP_DOMAIN: ${ACME_APP_DOMAIN:-}
      ACME_APP_ADDITIONAL_DOMAINS: ${ACME_APP_ADDITIONAL_DOMAINS:-}
      ACME_APP_RENEW_BEFORE_DAYS: ${ACME_APP_RENEW_BEFORE_DAYS:-30}
      ACME_APP_EAB_KID: ${ACME_APP_EAB_KID:-}
      ACME_APP_EAB_HMAC_KEY: ${ACME_APP_EAB_HMAC_KEY:-}
      ACME_APP_DEST: ${ACME_APP_DEST:-/data/certificates/app}
      ACME_MAILSEC_ENABLED: ${ACME_MAILSEC_ENABLED:-false}
      ACME_MAILSEC_SERVER: ${ACME_MAILSEC_SERVER:-}
      ACME_MAILSEC_EMAIL: ${ACME_MAILSEC_EMAIL:-}
      ACME_MAILSEC_DOMAIN: ${ACME_MAILSEC_DOMAIN:-}
      ACME_MAILSEC_RENEW_BEFORE_DAYS: ${ACME_MAILSEC_RENEW_BEFORE_DAYS:-30}
      ACME_MAILSEC_EAB_KID: ${ACME_MAILSEC_EAB_KID:-}
      ACME_MAILSEC_EAB_HMAC_KEY: ${ACME_MAILSEC_EAB_HMAC_KEY:-}
      ACME_MAILSEC_DEST: ${ACME_MAILSEC_DEST:-/data/certificates/mailsec}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      LOG_LEVEL: ${APACHE_LOG_LEVEL:-info}
      SSL_PROTOCOL: ${APACHE_SSL_PROTOCOL:--all -TLSv1.3 +TLSv1.2}
      SSL_INSECURE_RENEGOTIATION: ${SSL_INSECURE_RENEGOTIATION:-on}
      CIPHER_SUITE: ${CIPHER_SUITE:-ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305}
      USE_STAPLING: ${USE_STAPLING:-off}
      STAPLING_RESPONDER_ERRORS: ${STAPLING_RESPONDER_ERRORS:-off}
    tmpfs:
      - /tmp:mode=770,uid=82,gid=82,rw,noexec,nosuid,nodev
      - /acme-challenge/.well-known/acme-challenge:mode=770,uid=82,gid=82,size=10M,rw,noexec,nosuid,nodev
      - /data/run:mode=770,uid=82,gid=82,rw,noexec,nosuid,nodev
    volumes:
      - ${WEB_LOGS_PATH:-web_logs_datadir}:/data/log:rw,noexec,nosuid,nodev
      - ${WEB_CERTIFICATES_PATH:-web_certificates_datadir}:/data/certificates:rw,noexec,nosuid,nodev
      - ${ACME_DATADIR:-acme_datadir}:/etc/letsencrypt:rw,noexec,nosuid,nodev
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  redis:
    image: hubdocker.libriciel.fr/redis:8.10.0-alpine3.23@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:mode=750,rw,noexec,nosuid,nodev

  clamav:
    image: hubdocker.libriciel.fr/clamav/clamav:1.5.2-35@sha256:898c176d1cfec61d4585f71d1e2e8515b3cc8d5f83cd9fc2f6748e8b20de82a2
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "clamav"
    entrypoint: ["/init-unprivileged"]
    tmpfs:
      - /var/log/clamav:mode=750,uid=100,gid=100,rw,noexec,nosuid,nodev
      - /tmp:mode=750,uid=100,gid=100,rw,noexec,nosuid,nodev

  beanstalkd:
    image: hubdocker.libriciel.fr/schickling/beanstalkd:latest@sha256:19a928e3563973219e44f6c29df2a71103c7db894692ae94b7d0760837877e73
    restart: unless-stopped

  pades-valid:
    image: registry.libriciel.fr/public/signature/pades-valid:1.4.10@sha256:e63795261768cbf7cd39f543fcea0c9efce9b6961f39536604ef16c40e69abcb
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx512M"
    mem_limit: 768M

  pdf-stamp:
    image: registry.libriciel.fr/public/signature/pdf-stamp:2.7.15@sha256:e111a2b77e67415270b0e9c149d4c7b5460aa464d379b390e15d27292576e261
    restart: unless-stopped
    mem_limit: 2G

volumes:
  app_workspace:
  app_logs_datadir:
  app_certificates:
  web_logs_datadir:
  web_certificates_datadir:
  acme_datadir:
